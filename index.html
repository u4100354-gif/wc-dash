<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d30"><title>Забег до туалета • WC DASH</title><link rel="stylesheet" href="style.css?v=5.4"></head><body>

<main id="stage"><canvas id="screen" aria-label="Три полосы коридора от лифта до туалета"></canvas>
