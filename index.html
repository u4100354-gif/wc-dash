<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d30"><title>Забег до туалета • WC DASH</title><link rel="stylesheet" href="style.css?v=1"></head><body>
<header><strong><b>WC</b> DASH</strong><span>РЕКОРД <output id="best">0</output></span><button id="mute" aria-label="Звук" title="Звук">♪</button><button id="pause" hidden aria-label="Пауза">Ⅱ</button></header>
<main id="stage"><canvas id="screen" aria-label="Три полосы коридора от лифта до туалета"></canvas>
<section id="cover"><div class="poster"><div class="route"><i></i> ЛИФТ → WC</div><h1>ЗАБЕГ<br>ДО <em>ТУАЛЕТА</em></h1><p>Лифт приехал. До унитаза 360 метров.<br>Собери слова и какашки кота Марса по пути.</p><button class="primary" id="start">ПОБЕЖАЛИ <span>→</span></button></div></section>
<div id="hud" hidden><div><small>ДО WC</small><strong id="distance"></strong></div><div class="word"><small>СОБЕРИ СЛОВО</small><strong id="word"></strong></div><div><small>💩 МОНЕТЫ</small><strong id="count">0</strong></div></div>
<div id="toast" role="status"></div>
<section id="overlay" hidden><article><small id="label"></small><h2 id="heading"></h2><p id="result"></p><button class="primary" id="action"></button><button id="home">В меню</button></article></section></main>
<footer><span><b>← →</b> полоса</span><span><b>↑</b> прыжок</span><span><b>↓</b> подкат</span><small id="hint"></small></footer>
<script src="game.js?v=1"></script></body></html>
